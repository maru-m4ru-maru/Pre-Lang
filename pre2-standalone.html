<script>
/* ── editor.js ── */
/* 色づけ (Hl) と、textarea の上に色つきの文字を重ねた小さなコードエディタ (createEditor) */
const Hl = (() => {
  const KW = new Set(Pre2.keywords);
  const LIT = new Set(['true', 'false', 'null']);
  const BUILTIN = new Set(Pre2.builtinNames());
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const span = (c, s) => '<span class="tk-' + c + '">' + esc(s) + '</span>';
  const WORDRE = /[\p{L}_][\p{L}\p{N}_]*/uy;
  const NUMRE = /\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?/y;
  const OPRE = /\.\.<|\.\.|\|>|=>|[-+*\/%=<>!?:]+/y;

  // "..." を最後まで読み、{式} の部分だけ目立たせる。式の中の文字列 "..." も飛ばす
  function scanString(src, i) {
    let out = '', buf = '';
    const flush = () => { if (buf) { out += span('s', buf); buf = ''; } };
    let j = i + 1;
    buf = '"';
    while (j < src.length) {
      const c = src[j];
      if (c === '\\') { buf += src.slice(j, j + 2); j += 2; continue; }
      if (c === '"') { buf += '"'; j++; flush(); return { html: out, end: j }; }
      if (c === '{') {
        let d = 1, k = j + 1;
        while (k < src.length && d > 0) {
          if (src[k] === '"') { k++; while (k < src.length && src[k] !== '"') { if (src[k] === '\\') k++; k++; } }
          else if (src[k] === '{') d++;
          else if (src[k] === '}') d--;
          k++;
        }
        if (d === 0) { flush(); out += '<span class="tk-i">' + esc(src.slice(j, k)) + '</span>'; j = k; continue; }
      }
      buf += c; j++;
    }
    flush();
    return { html: out, end: j };
  }

  function html(src) {
    let out = '', i = 0, prevWord = '';
    const n = src.length;
    while (i < n) {
      const c = src[i];
      if (c === '/' && src[i + 1] === '/') {
        let e = src.indexOf('\n', i); if (e < 0) e = n;
        out += span('c', src.slice(i, e)); i = e; continue;
      }
      if (c === '"') { const r = scanString(src, i); out += r.html; i = r.end; prevWord = ''; continue; }
      if (c >= '0' && c <= '9') { NUMRE.lastIndex = i; const m = NUMRE.exec(src); out += span('n', m[0]); i += m[0].length; prevWord = ''; continue; }
      WORDRE.lastIndex = i;
      const wm = WORDRE.exec(src);
      if (wm) {
        const w = wm[0];
        i += w.length;
        const callNext = src[i] === '(';
        if (prevWord === 'fn') out += span('f', w);
        else if (LIT.has(w)) out += span('l', w);
        else if (KW.has(w)) out += span('k', w);
        else if (BUILTIN.has(w)) out += span('b', w);
        else if (callNext) out += span('f', w);
        else out += esc(w);
        prevWord = w; continue;
      }
      OPRE.lastIndex = i;
      const om = OPRE.exec(src);
      if (om) { out += span('o', om[0]); i += om[0].length; prevWord = ''; continue; }
      out += esc(c); i++;
      if (c !== ' ' && c !== '\t') prevWord = '';
    }
    return out;
  }
  return { html, esc };
})();

function createEditor(o) {
  const { ta, hl, gutter, layer } = o;
  const LH = 22;
  let lineCount = -1, errLine = 0, tabFree = false;

  function buildGutter(n) {
    let h = '';
    for (let i = 1; i <= n; i++) h += '<span' + (i === errLine ? ' class="bad"' : '') + '>' + i + '</span>';
    gutter.innerHTML = h + '<div class="gutter-pad"></div>';
    lineCount = n;
  }
  function paintError() {
    layer.innerHTML = errLine ? '<div class="band" style="top:' + (errLine - 1) * LH + 'px"></div>' : '';
    const spans = gutter.children;
    for (let i = 0; i < spans.length - 1; i++) spans[i].className = i + 1 === errLine ? 'bad' : '';
  }
  function update() {
    const v = ta.value;
    hl.innerHTML = Hl.html(v) + '\n';
    const n = v.split('\n').length;
    if (n !== lineCount) { buildGutter(n); paintError(); }
    sync();
  }
  function sync() {
    hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
    gutter.scrollTop = ta.scrollTop;
    layer.style.transform = 'translateY(' + -ta.scrollTop + 'px)';
  }
  function insert(text) {
    ta.focus();
    let ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
    if (!ok) {
      ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }
  function lineBounds(v, s, e) {
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    const le0 = e > s && v[e - 1] === '\n' ? e - 1 : e;
    const nl = v.indexOf('\n', le0);
    return [ls, nl < 0 ? v.length : nl];
  }
  function indentLines(shift) {
    const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    if (s === e && !shift) { insert('  '); return; }
    const [ls, le] = lineBounds(v, s, e);
    const out = v.slice(ls, le).split('\n').map((l) => (shift ? l.replace(/^( {1,2}|\t)/, '') : '  ' + l)).join('\n');
    ta.setSelectionRange(ls, le);
    insert(out);
    ta.setSelectionRange(ls, ls + out.length);
  }
  function toggleComment() {
    const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    const [ls, le] = lineBounds(v, s, e);
    const lines = v.slice(ls, le).split('\n');
    const nonEmpty = lines.filter((l) => l.trim() !== '');
    const all = nonEmpty.length > 0 && nonEmpty.every((l) => /^\s*\/\/ ?/.test(l));
    const out = lines.map((l) => (l.trim() === '' ? l : all ? l.replace(/^(\s*)\/\/ ?/, '$1') : l.replace(/^(\s*)/, '$1// '))).join('\n');
    ta.setSelectionRange(ls, le);
    insert(out);
    ta.setSelectionRange(ls, ls + out.length);
  }
  function smartEnter() {
    const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    const indent = /^[ \t]*/.exec(v.slice(ls, s))[0];
    const prev = v[s - 1], next = v[e];
    const opens = prev === '{' || prev === '(' || prev === '[';
    const extra = opens ? '  ' : '';
    if (opens && ((prev === '{' && next === '}') || (prev === '(' && next === ')') || (prev === '[' && next === ']'))) {
      insert('\n' + indent + extra + '\n' + indent);
      const p = s + 1 + indent.length + extra.length;
      ta.setSelectionRange(p, p);
    } else insert('\n' + indent + extra);
  }
  const PAIRS = { '(': ')', '[': ']', '{': '}', '"': '"' };
  const WORD = /[\p{L}\p{N}_]/u;
  function onChar(ev) {
    const ch = ev.key, v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    if (PAIRS[ch] && s !== e) {
      ev.preventDefault();
      const sel = v.slice(s, e);
      insert(ch + sel + PAIRS[ch]);
      ta.setSelectionRange(s + 1, s + 1 + sel.length);
      return;
    }
    if (s !== e) return;
    if ((ch === ')' || ch === ']' || ch === '}' || ch === '"') && v[s] === ch) {
      ev.preventDefault();
      ta.setSelectionRange(s + 1, s + 1);
      return;
    }
    if (ch === '}' && /^[ \t]{2,}$/.test(v.slice(v.lastIndexOf('\n', s - 1) + 1, s)) && (v[s] === undefined || v[s] === '\n')) {
      // 空の行で } を打ったら、ひとつ左に戻す
      ev.preventDefault();
      ta.setSelectionRange(s - 2, s);
      insert('}');
      return;
    }
    if (!PAIRS[ch]) return;
    const prev = v[s - 1], next = v[s];
    if (ch === '"') {
      if (prev && WORD.test(prev)) return;
      if (next && WORD.test(next)) return;
    } else if (next && !/[\s)\]}.,]/.test(next)) return;
    ev.preventDefault();
    insert(ch + PAIRS[ch]);
    ta.setSelectionRange(s + 1, s + 1);
  }
  function onBackspace(ev) {
    const v = ta.value, s = ta.selectionStart;
    if (s !== ta.selectionEnd || s === 0) return;
    if (PAIRS[v[s - 1]] && PAIRS[v[s - 1]] === v[s]) { ev.preventDefault(); ta.setSelectionRange(s - 1, s + 1); insert(''); }
  }

  ta.addEventListener('input', () => { update(); if (errLine) setError(0); if (o.onChange) o.onChange(); });
  ta.addEventListener('scroll', sync);
  ta.addEventListener('keydown', (ev) => {
    if (ev.isComposing || ev.keyCode === 229) return;
    const mod = ev.metaKey || ev.ctrlKey;
    if (mod && ev.key === 'Enter') { ev.preventDefault(); if (o.onRun) o.onRun(); return; }
    if (mod && ev.key === '/') { ev.preventDefault(); toggleComment(); return; }
    if (ev.key === 'Escape') { tabFree = true; return; }
    if (ev.key === 'Tab') {
      if (tabFree || ev.altKey || mod) { tabFree = false; return; }
      ev.preventDefault(); indentLines(ev.shiftKey); return;
    }
    tabFree = false;
    if (mod || ev.altKey) return;
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); smartEnter(); return; }
    if (ev.key === 'Backspace') { onBackspace(ev); return; }
    if (ev.key.length === 1) onChar(ev);
  });

  function setError(line) { errLine = line || 0; paintError(); }
  function setValue(text) { ta.value = text; errLine = 0; lineCount = -1; update(); ta.scrollTop = 0; ta.scrollLeft = 0; sync(); }
  function focusAt(line, col) {
    const lines = ta.value.split('\n');
    line = Math.max(1, Math.min(lines.length, line || 1));
    let idx = 0;
    for (let i = 0; i < line - 1; i++) idx += lines[i].length + 1;
    idx += Math.max(0, Math.min(lines[line - 1].length, (col || 1) - 1));
    ta.focus();
    ta.setSelectionRange(idx, idx);
    const y = (line - 1) * LH;
    if (y < ta.scrollTop || y > ta.scrollTop + ta.clientHeight - LH * 2) ta.scrollTop = Math.max(0, y - ta.clientHeight / 2);
    sync();
  }
  update();
  return { get value() { return ta.value; }, setValue, setError, focusAt, update };
}

/* ── stage.js ── */
/* ステージ: エンジンが返した items (部品・文字・表・絵) を画面にする。
 * 実行のたびに全部を作り直さない。同じ部品は同じ DOM を使い回すので、
 * スライダーをつかんだまま・入力欄に文字を打っているままでも、プログラムが何度実行されても途切れない。 */
function createStage(root, hooks) {
  const list = root.querySelector('.list');
  const banner = root.querySelector('.banner');
  const emptyEl = root.querySelector('.hint');
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fmt = (x) => String(Number(Number(x).toPrecision(12)));
  const lastSent = new Map(); // ラベル → 最後に送った入力の番号
  let nodes = new Map();
  let wantsMouse = false;

  /* ── 部品 ── */
  function rowOf(cls, label) {
    const el = mk('label', 'w ' + cls);
    const name = mk('span', 'name', label);
    el.appendChild(name);
    return { el, name };
  }
  function send(label, value) { lastSent.set(label, hooks.input(label, value)); }

  function mkSlider() {
    const { el, name } = rowOf('');
    const input = mk('input'); input.type = 'range';
    const val = mk('span', 'val');
    el.append(input, val);
    input.addEventListener('input', () => { val.textContent = fmt(input.value); send(el.dataset.label, +input.value); });
    return { el, update(it, write) {
      el.dataset.label = it.label; name.textContent = it.label;
      input.min = it.min; input.max = it.max; input.step = it.step;
      if (write) { input.value = it.value; val.textContent = fmt(it.value); } else val.textContent = fmt(input.value);
    } };
  }
  function mkToggle() {
    const { el, name } = rowOf('');
    const sw = mk('span', 'sw');
    const input = mk('input'); input.type = 'checkbox';
    sw.append(input, mk('i'));
    const val = mk('span', 'val');
    el.append(sw, val);
    input.addEventListener('change', () => { val.textContent = input.checked ? 'true' : 'false'; send(el.dataset.label, input.checked); });
    return { el, update(it, write) {
      el.dataset.label = it.label; name.textContent = it.label;
      if (write) { input.checked = !!it.value; val.textContent = it.value ? 'true' : 'false'; }
    } };
  }
  function mkTextbox() {
    const { el, name } = rowOf('wide');
    const input = mk('input'); input.type = 'text'; input.autocomplete = 'off'; input.spellcheck = false;
    el.appendChild(input);
    let composing = false;
    input.addEventListener('compositionstart', () => { composing = true; });
    input.addEventListener('compositionend', () => { composing = false; });
    input.addEventListener('input', () => send(el.dataset.label, input.value));
    return { el, update(it, write) {
      el.dataset.label = it.label; name.textContent = it.label;
      if (write && !composing && input.value !== it.value) input.value = it.value;
    } };
  }
  function mkChoice() {
    const { el, name } = rowOf('wide');
    const sel = mk('select');
    el.appendChild(sel);
    let shown = null;
    sel.addEventListener('change', () => send(el.dataset.label, sel.selectedIndex));
    return { el, update(it, write) {
      el.dataset.label = it.label; name.textContent = it.label;
      const key = it.options.join('\u0000');
      if (key !== shown) { shown = key; sel.textContent = ''; for (const o of it.options) sel.appendChild(mk('option', '', o)); }
      if (write) sel.selectedIndex = it.index;
    } };
  }
  function mkButton() {
    const b = mk('button', 'pbtn'); b.type = 'button';
    b.addEventListener('click', () => hooks.click(b.dataset.label));
    return { el: b, update(it) { b.dataset.label = it.label; b.textContent = it.label; } };
  }

  /* ── 文字・表 ── */
  function mkText() {
    const el = mk('div', 'o-text');
    return { el, update(it) { if (el.textContent !== it.s) el.textContent = it.s; el.style.minHeight = '1.7em'; } };
  }
  function mkTable() {
    const el = mk('div', 'tbl-wrap');
    let last = '';
    return { el, update(it) {
      const sig = JSON.stringify([it.cols, it.rows, it.more]);
      if (sig === last) return;
      last = sig;
      el.textContent = '';
      const table = mk('table');
      const head = mk('tr');
      it.cols.forEach((c) => head.appendChild(mk('th', c.num ? 'num' : '', c.name)));
      table.appendChild(mk('thead')).appendChild(head);
      const body = mk('tbody');
      for (const r of it.rows) {
        const tr = mk('tr');
        r.forEach((v, i) => tr.appendChild(mk('td', it.cols[i].num ? 'num' : '', v)));
        body.appendChild(tr);
      }
      table.appendChild(body);
      el.appendChild(table);
      if (it.more > 0) el.appendChild(mk('div', 'tbl-more', `ほか ${it.more} 行`));
    } };
  }

  /* ── 絵 ── */
  function mkCanvas() {
    const cv = mk('canvas', 'cv');
    const c2 = cv.getContext('2d');
    let cw = 480, ch = 320;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (cw / (r.width || 1)), y: (e.clientY - r.top) * (ch / (r.height || 1)) }; };
    const down = { v: false };
    cv.addEventListener('pointermove', (e) => { const p = pos(e); hooks.mouse({ x: p.x, y: p.y, down: down.v }); });
    cv.addEventListener('pointerdown', (e) => { down.v = true; try { cv.setPointerCapture(e.pointerId); } catch (x) { /* 無視 */ } const p = pos(e); hooks.mouse({ x: p.x, y: p.y, down: true }); });
    const up = (e) => { down.v = false; const p = pos(e); hooks.mouse({ x: p.x, y: p.y, down: false }); };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    const color = (prop, c, fallback) => { c2[prop] = fallback; c2[prop] = c; };
    return { el: cv, update(it) {
      const dpr = window.devicePixelRatio || 1;
      cw = it.w; ch = it.h;
      const W = Math.round(cw * dpr), H = Math.round(ch * dpr);
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
      cv.style.width = cw + 'px';
      cv.classList.toggle('mouse', wantsMouse);
      c2.setTransform(dpr, 0, 0, dpr, 0, 0);
      color('fillStyle', it.bg, '#fbfbf8');
      c2.fillRect(0, 0, cw, ch);
      c2.lineCap = 'round'; c2.textBaseline = 'alphabetic';
      for (const s of it.shapes) {
        switch (s[0]) {
          case 'c':
            c2.beginPath(); c2.arc(s[1], s[2], Math.max(0, s[3]), 0, Math.PI * 2);
            if (s[5]) { color('fillStyle', s[4], '#222'); c2.fill(); } else { color('strokeStyle', s[4], '#222'); c2.lineWidth = s[6]; c2.stroke(); }
            break;
          case 'r':
            if (s[6]) { color('fillStyle', s[5], '#222'); c2.fillRect(s[1], s[2], s[3], s[4]); }
            else { color('strokeStyle', s[5], '#222'); c2.lineWidth = s[7]; c2.strokeRect(s[1], s[2], s[3], s[4]); }
            break;
          case 'l':
            c2.beginPath(); c2.moveTo(s[1], s[2]); c2.lineTo(s[3], s[4]);
            color('strokeStyle', s[5], '#222'); c2.lineWidth = s[6]; c2.stroke();
            break;
          default:
            color('fillStyle', s[4], '#222'); c2.font = s[5] + 'px "M PLUS 1 Code", "Zen Kaku Gothic New", ui-monospace, monospace';
            c2.fillText(s[1], s[2], s[3]);
        }
      }
    } };
  }

  const MAKERS = { slider: mkSlider, toggle: mkToggle, textbox: mkTextbox, choice: mkChoice, button: mkButton, text: mkText, table: mkTable, canvas: mkCanvas };

  /* ── 画面を更新する ── */
  function render(items, frameId, flags) {
    wantsMouse = !!(flags && flags.wantsMouse);
    const next = new Map();
    const order = [];
    const counts = { text: 0, table: 0, canvas: 0 };
    for (const it of items) {
      const kind = it.t === 'w' ? it.kind : it.t;
      const key = it.t === 'w' ? 'w:' + it.label : kind + ':' + counts[kind]++;
      let node = nodes.get(key);
      if (!node || node.kind !== kind) node = Object.assign(MAKERS[kind](), { kind });
      node.update(it, !(lastSent.get(it.label) > frameId));
      next.set(key, node);
      order.push(node);
    }
    for (const [k, n] of nodes) if (!next.has(k)) n.el.remove();
    let cursor = list.firstChild;
    for (const n of order) { if (n.el === cursor) cursor = cursor.nextSibling; else list.insertBefore(n.el, cursor); }
    nodes = next;
    emptyEl.hidden = items.length > 0;
  }
  function clear() { for (const n of nodes.values()) n.el.remove(); nodes = new Map(); emptyEl.hidden = true; lastSent.clear(); }
  function setBanner(node) { banner.textContent = ''; if (node) banner.appendChild(node); root.classList.toggle('stale', !!node); }
  return { render, clear, setBanner };
}

    js: '<label>名前で検索 <input id="q" type="text"></label>\n<label>この年齢以上\n  <input id="age" type="range" min="0" max="60" value="0">\n  <output id="ageout">0</output>\n</label>\n<table id="tbl"></table>\n<script>\n  const people = [\n    {name: "Aya", age: 31}, {name: "Ken", age: 24},\n    {name: "Mio", age: 45}, {name: "Ren", age: 38},\n  ]\n  const q = document.getElementById("q")\n  const age = document.getElementById("age")\n  const tbl = document.getElementById("tbl")\n  function render() {\n    document.getElementById("ageout").textContent = age.value\n    const name = q.value.toLowerCase()\n    const rows = people\n      .filter(p => p.name.toLowerCase().includes(name) && p.age >= +age.value)\n      .sort((a, b) => a.age - b.age)\n    tbl.innerHTML = "<tr><th>name</th><th>age</th></tr>" +\n      rows.map(p => `<tr><td>${p.name}</td><td>${p.age}</td></tr>`).join("")\n  }\n  q.oninput = render\n  age.oninput = render\n  render()\n<\/script>',
  },
];
// 行数: 空行とコメントだけの行は数えない
function codeLines(src) { return src.split('\n').filter((l) => l.trim() !== '' && !/^\s*\/\//.test(l)).length; }

/* ── docs_view.js ── */
/* 「Pre のすべて」「JavaScript と比べる」の画面を作る */
function rich(text) { return Hl.esc(text).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function codeBlock(src) { const pre = el('pre'); pre.innerHTML = Hl.html(src); return pre; }
function section(parent, id, title, lead) {
  const s = el('section', 'sec'); s.id = id;
  s.appendChild(el('h2', '', title));
  if (lead) { const p = el('p', 'lead'); p.innerHTML = rich(lead); s.appendChild(p); }
  parent.appendChild(s);
  return s;
}
function outputOf(code) {
  const r = Pre2.run(code);
  return r.ok ? Pre2.toText(r.items).replace(/\n$/, '') : r.error.kind + ': ' + r.error.message;
}

function renderRef(root, onOpen) {
  const nB = Pre2.builtinNames().length, nK = Pre2.keywords.length;
  root.textContent = '';
  root.appendChild(el('h1', '', 'Pre のすべて'));
  const lead = el('p', 'lead');
  lead.innerHTML = `言語の全体が、このページに入っています。キーワードは ${nK} 個、組み込みは ${nB} 個 (値 3 つを含む)。メソッドも、クラスも、型もありません。`;
  root.appendChild(lead);

  const m = section(root, 'ref-model', '1. たった 1 つのルール', 'ここから、書き味のほとんどが出てきます。');
  const ol = el('ol', 'rules');
  for (const [h, d] of DOCS.model) { const li = el('li'); li.appendChild(el('b', '', h)); const p = el('span'); p.innerHTML = rich(d); li.appendChild(p); ol.appendChild(li); }
  m.appendChild(ol);
  const demo = codeBlock(COMPARE[0].pre);
  m.appendChild(demo);
  m.appendChild(openButton('このカウンターを動かす', COMPARE[0].pre, onOpen));

  const k = section(root, 'ref-kw', `2. キーワード ${nK} 個`);
  const kg = el('div', 'kwgrid');
  for (const [name, d, ex] of DOCS.keywords) {
    const c = el('div', 'kw');
    c.appendChild(el('code', 'tk-k', name));
    const p = el('span'); p.innerHTML = rich(d); c.appendChild(p);
    c.appendChild(el('small', '', ex));
    kg.appendChild(c);
  }
  k.appendChild(kg);

  const sx = section(root, 'ref-syntax', '3. 書き方', '短い例は、その場で実行した結果を下に出しています。');
  const grid = el('div', 'cards');
  for (const [title, code, note] of DOCS.syntax) {
    const c = el('div', 'card');
    c.appendChild(el('h3', '', title));
    c.appendChild(codeBlock(code));
    c.appendChild(el('pre', 'result', outputOf(code)));
    const p = el('p', 'note'); p.innerHTML = rich(note); c.appendChild(p);
    c.appendChild(openButton('エディタで開く', code, onOpen));
    grid.appendChild(c);
  }
  sx.appendChild(grid);

  const b = section(root, 'ref-builtins', `4. 組み込み ${nB} 個`, 'ここに載っているのが全部です。');
  const bg = el('div', 'bgrid');
  for (const [group, rows] of DOCS.builtins) {
    const box = el('div', 'bbox');
    box.appendChild(el('h3', '', group));
    const dl = el('dl');
    for (const [sig, d] of rows) { const dt = el('dt'); dt.appendChild(el('code', '', sig)); dl.appendChild(dt); dl.appendChild(el('dd', '', d)); }
    box.appendChild(dl);
    bg.appendChild(box);
  }
  b.appendChild(bg);

  const ins = section(root, 'ref-instead', '5. ほかの言語の書き方は、こうなる', '書けない構文を書くと、エラーがこの表と同じ書き方を教えます。');
  const wrap = el('div', 'tbl'); const t = el('table');
  t.innerHTML = '<thead><tr><th>ほかの言語</th><th>Pre</th><th></th></tr></thead>';
  const tb = el('tbody');
  for (const [from, to, note] of DOCS.instead) {
    const tr = el('tr');
    tr.appendChild(el('td')).appendChild(el('code', '', from));
    tr.appendChild(el('td')).appendChild(el('code', '', to));
    const td = el('td'); td.innerHTML = rich(note); tr.appendChild(td);
    tb.appendChild(tr);
  }
  t.appendChild(tb); wrap.appendChild(t); ins.appendChild(wrap);

  const lm = section(root, 'ref-limits', '6. 向いていないこと');
  const ul = el('ul', 'plain');
  for (const x of DOCS.limits) { const li = el('li'); li.innerHTML = rich(x); ul.appendChild(li); }
  lm.appendChild(ul);
}

function openButton(label, code, onOpen) {
  const b = el('button', 'btn', label); b.type = 'button';
  b.addEventListener('click', () => onOpen(code));
  return b;
}

function renderCompare(root, onOpen) {
  root.textContent = '';
  root.appendChild(el('h1', '', '素の JavaScript と比べる'));
  const lead = el('p', 'lead');
  lead.innerHTML = '同じ動きを、ライブラリなしの JavaScript (HTML + script) で書くとこうなります。行数は、空行とコメントを除いて、いまこのページで数えています。';
  root.appendChild(lead);
  let totalPre = 0, totalJs = 0;
  for (const d of COMPARE) {
    const lp = codeLines(d.pre), lj = codeLines(d.js);
    totalPre += lp; totalJs += lj;
    const s = section(root, 'cmp-' + d.id, d.title, d.what);
    const cols = el('div', 'cols');
    const a = el('div', 'col');
    const ah = el('div', 'colhead'); ah.appendChild(el('b', '', 'Pre')); ah.appendChild(el('span', 'count', lp + ' 行'));
    a.append(ah, codeBlock(d.pre), openButton('動かして書き換える', d.pre, onOpen));
    const j = el('div', 'col');
    const jh = el('div', 'colhead'); jh.appendChild(el('b', '', 'JavaScript')); jh.appendChild(el('span', 'count', lj + ' 行'));
    const jp = el('pre'); jp.textContent = d.js;
    j.append(jh, jp);
    cols.append(a, j);
    s.appendChild(cols);
  }
  const sum = section(root, 'cmp-sum', '合計');
  const p = el('p', 'big'); p.innerHTML = `Pre <b>${totalPre} 行</b> ・ JavaScript <b>${totalJs} 行</b> (約 ${(totalJs / totalPre).toFixed(1)} 倍)`;
  sum.appendChild(p);
  const fair = section(root, 'cmp-fair', '公平のために');
  const ul = el('ul', 'plain');
  const items = [
    '減っているのは、イベントの登録と、再描画の呼び出しと、アニメーションのループです。計算そのものは同じです。',
    'React や Svelte のようなフレームワークを使えば、JavaScript 側も短くなります。ただし、その分だけビルドや import が要ります。Pre は、ブラウザで開くだけで動きます。',
    '逆に、Pre が JavaScript に勝てないところは、ページの「Pre のすべて」の最後に書いてあります。大きなアプリや速さが要るものは、JavaScript を使ってください。',
    'Pre が狙っているのは、「値を触ったら結果が変わる、小さなもの」を最短で作ることだけです。',
  ];
  for (const x of items) ul.appendChild(el('li', '', x));
  fair.appendChild(ul);
}

/* ── app.js ── */
/* プレイグラウンド本体: エンジンとの接続・時間・ライブ実行・エラー表示 */
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できなくても動く */ } },
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* ── エンジン: Web Worker (使えなければメインスレッド) ── */
const WORKER_SRC = $('engine-src').textContent + '\n' + $('host-src').textContent
  + '\nconst __h = createHost((m) => self.postMessage(m), self.Pre2);\nself.onmessage = (e) => __h.handle(e.data);\n';
let worker = null, local = null, gotMsg = false, watchdog = 0;
let nextId = 1, busy = false, inflight = null, queue = [];
let anim = false, wantMouse = false, mouseDirty = false, raf = 0, offPlay = false;
let mouse = { x: 240, y: 160, down: false };
let loadedCode = '';

const clock = { t0: performance.now(), paused: false, pausedAt: 0, shift: 0 };
const nowSec = () => ((clock.paused ? clock.pausedAt : performance.now()) - clock.t0 - clock.shift) / 1000;
function restartClock() { clock.t0 = performance.now(); clock.shift = 0; clock.pausedAt = clock.t0; }

function useLocal() { worker = null; local = createHost(onMsg, Pre2); }
function startEngine() {
  if (worker || local) return;
  gotMsg = false;
  try { worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }))); }
  catch (err) { useLocal(); return; }
  worker.onmessage = (e) => { gotMsg = true; onMsg(e.data); };
  worker.onerror = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    const pending = inflight;
    try { worker.terminate(); } catch (x) { /* 無視 */ }
    worker = null;
    if (!gotMsg) { useLocal(); if (pending) local.handle(pending); return; }
    busy = false; inflight = null;
    showError({ kind: 'InternalError', message: (e && e.message) || '実行エンジンでエラーが起きました', line: null, col: null, trace: [] });
  };
}
function dispatch(msg) {
  startEngine();
  msg.time = nowSec(); msg.mouse = { x: mouse.x, y: mouse.y, down: mouse.down };
  if (msg.t === 'load') loadedCode = msg.code;
  busy = true; inflight = msg;
  clearTimeout(watchdog);
  watchdog = setTimeout(hung, 8000);
  if (worker) worker.postMessage(msg); else local.handle(msg);
}
function hung() {
  if (worker) { try { worker.terminate(); } catch (x) { /* 無視 */ } worker = null; }
  busy = false; inflight = null; queue = []; anim = false;
  showError({ kind: 'TimeoutError', message: '実行エンジンが応答しなくなったので、止めて作り直しました (state は消えました)。コードを確認してください', line: null, col: null, trace: [] });
}
// 画面からの出来事を送る。エンジンが忙しいときは、まとめて (同じ部品の入力は最後の 1 つだけ) 順番待ちにする
function send(t, extra) {
  const msg = Object.assign({ id: nextId++, t }, extra);
  if (busy) {
    if (t === 'load') queue = queue.filter((q) => q.t !== 'load');
    if (t === 'input') queue = queue.filter((q) => !(q.t === 'input' && q.label === msg.label));
    queue.push(msg);
  } else dispatch(msg);
  return msg.id;
}
function onMsg(m) {
  clearTimeout(watchdog);
  busy = false; inflight = null;
  if (m.t === 'syntax') showError(m.error, true);
  else {
    anim = m.animating; wantMouse = m.wantsMouse;
    if (m.ok) { stage.render(m.items, m.id, { wantsMouse: wantMouse }); stage.setBanner(null); ed.setError(0); }
    else showError(m.error);
    setLive(m);
  }
  if (queue.length) dispatch(queue.shift());
  else if (mouseDirty && wantMouse && !anim) { mouseDirty = false; send('mouse'); }
  else scheduleTick();
}
function scheduleTick() {
  if (raf || busy || queue.length || !anim || clock.paused || document.hidden || offPlay) return;
  raf = requestAnimationFrame(() => { raf = 0; if (!busy && !queue.length && anim && !clock.paused) send('tick'); });
}
document.addEventListener('visibilitychange', scheduleTick);

/* ── 状態表示・一時停止 ── */
const liveEl = $('live'), pauseBtn = $('btn-pause'), statusEl = $('status'), msEl = $('status-ms');
function setLive(m) {
  liveEl.hidden = !(m.animating); pauseBtn.hidden = !m.animating;
  liveEl.classList.toggle('paused', clock.paused);
  liveEl.textContent = clock.paused ? '停止中' : '動いています';
  pauseBtn.textContent = clock.paused ? '再開' : '一時停止';
  if (m.ok) {
    statusEl.className = 'good';
    statusEl.textContent = m.animating ? '時間で動いています' : m.wantsMouse ? 'マウスに反応します' : '操作を待っています';
  } else { statusEl.className = 'bad'; statusEl.textContent = 'エラー'; }
  msEl.textContent = m.ms != null ? '1 回の実行 ' + (m.ms < 10 ? m.ms.toFixed(1) : Math.round(m.ms)) + ' ms' : msEl.textContent;
}
pauseBtn.addEventListener('click', () => {
  if (clock.paused) { clock.shift += performance.now() - clock.pausedAt; clock.paused = false; send('tick'); }
  else { clock.paused = true; clock.pausedAt = performance.now(); }
  setLive({ ok: true, animating: true, wantsMouse: wantMouse, ms: null });
});

/* ── エラー表示 (どこで・何が・どう直すか) ── */
function wideCols(s) {
  let n = 0;
  for (const ch of s) n += /[ᄀ-ᅟ⺀-꓏가-힣豈-﫿︰-﹯＀-｠￠-￦]/.test(ch) ? 2 : 1;
  return n;
}
function errorBox(err, code, syntax) {
  const box = el('div', 'err');
  box.appendChild(el('h3', '', err.kind));
  box.appendChild(el('p', 'msg', err.message));
  const lines = code.split('\n');
  if (err.line && err.line <= lines.length) {
    const loc = el('button', 'loc', err.line + '行目' + (err.col ? ' ' + err.col + '列目' : ''));
    loc.type = 'button';
    loc.addEventListener('click', () => ed.focusAt(err.line, err.col));
    box.appendChild(loc);
    const pre = el('pre');
    const from = Math.max(1, err.line - 1), to = Math.min(lines.length, err.line + 1), w = String(to).length;
    for (let i = from; i <= to; i++) {
      const row = el('div');
      row.appendChild(el('span', 'ln', String(i).padStart(w) + ' │ '));
      row.appendChild(el('span', i === err.line ? 'hit' : '', lines[i - 1].replace(/\t/g, '  ') || ' '));
      pre.appendChild(row);
      if (i === err.line && err.col) {
        const c = el('div');
        c.appendChild(el('span', 'ln', ' '.repeat(w) + ' │ '));
        c.appendChild(el('span', 'hit', ' '.repeat(wideCols(lines[i - 1].replace(/\t/g, '  ').slice(0, err.col - 1))) + '^'));
        pre.appendChild(c);
      }
    }
    box.appendChild(pre);
  }
  if (err.trace && err.trace.length) {
    box.appendChild(el('div', 'trace', '呼び出しの流れ: ' + err.trace.slice(0, 8).map((f) => f.fn + '() ' + f.line + '行目').join(' ← ') + (err.trace.length > 8 ? ' ← …' : '')));
  }
  box.appendChild(el('p', 'keep', syntax ? '直すまで、前の動くプログラムを表示したままにしています。' : '直すまで、最後にうまく動いた画面を薄く残しています。'));
  return box;
}
function showError(err, syntax) {
  stage.setBanner(errorBox(err, loadedCode, syntax));
  ed.setError(err.line || 0);
  statusEl.className = 'bad'; statusEl.textContent = err.kind;
}

/* ── ステージとエディタ ── */
const stage = createStage($('stage'), {
  input: (label, value) => send('input', { label, value }),
  click: (label) => send('click', { label }),
  mouse: (m) => { mouse = m; if (wantMouse && !anim) { if (busy) mouseDirty = true; else send('mouse'); } },
});
let liveTimer = 0;
const ed = createEditor({
  ta: $('src'), hl: $('hl'), gutter: $('gutter'), layer: $('layer'),
  onRun: () => restart(),
  onChange: () => { updateLines(); clearTimeout(liveTimer); liveTimer = setTimeout(() => { store.set('pre2:code', ed.value); send('load', { code: ed.value, fresh: false }); }, 350); },
});
function updateLines() { $('linecount').textContent = codeLines(ed.value) + ' 行 (空行とコメントを除く)'; }
function restart() { updateLines(); clearTimeout(liveTimer); restartClock(); clock.paused = false; stage.clear(); store.set('pre2:code', ed.value); send('load', { code: ed.value, fresh: true }); }
function openCode(code) { ed.setValue(code); restart(); }

/* ── main.js ── */
/* 画面の切り替え・サンプル・起動 */
const EXAMPLES = JSON.parse($('examples-json').textContent);
const TAG_LABEL = { '触る': '触って試す', '動く': '動くもの', '作る': '小さなアプリ' };
const sel = $('examples');
sel.appendChild(new Option('サンプルを開く…', ''));
const groups = {};
EXAMPLES.forEach((ex, i) => {
  let g = groups[ex.tag];
  if (!g) { g = groups[ex.tag] = el('optgroup'); g.label = TAG_LABEL[ex.tag] || ex.tag; sel.appendChild(g); }
  g.appendChild(new Option(ex.title + ' — ' + ex.desc, String(i)));
});
sel.addEventListener('change', () => { if (sel.value !== '') { setView('play'); openCode(EXAMPLES[+sel.value].code); } sel.value = ''; });
$('btn-restart').addEventListener('click', restart);

const built = {};
let leftAt = 0;
function buildToc(name) {
  const toc = $('toc-' + name);
  toc.textContent = '';
  for (const h of $('doc-' + name).querySelectorAll('section > h2')) {
    const a = el('a', '', h.textContent); a.href = '#' + h.parentNode.id;
    a.addEventListener('click', (e) => { e.preventDefault(); h.scrollIntoView({ block: 'start' }); });
    toc.appendChild(a);
  }
}
function setView(name) {
  const wasPlay = !offPlay;
  for (const k of ['play', 'ref', 'cmp']) { $('nav-' + k).setAttribute('aria-selected', k === name ? 'true' : 'false'); $('view-' + k).hidden = k !== name; }
  $('play-tools').hidden = name !== 'play';
  if (name === 'ref' && !built.ref) { renderRef($('doc-ref'), openIn); buildToc('ref'); built.ref = true; }
  if (name === 'cmp' && !built.cmp) { renderCompare($('doc-cmp'), openIn); buildToc('cmp'); built.cmp = true; }
  offPlay = name !== 'play';
  if (offPlay && wasPlay) leftAt = performance.now();
  if (!offPlay && !wasPlay) { if (!clock.paused) clock.shift += performance.now() - leftAt; ed.update(); scheduleTick(); }
}
function openIn(code) { setView('play'); openCode(code); }
for (const k of ['play', 'ref', 'cmp']) $('nav-' + k).addEventListener('click', () => setView(k));

$('ver').textContent = 'v' + Pre2.version;
ed.setValue(store.get('pre2:code') || EXAMPLES[0].code);
restart();

</script>
</body></html>
